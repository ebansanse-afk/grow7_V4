<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>grow7</title><style>
:root{font-family:system-ui,sans-serif;color:#f7f3ff;background:#101022}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292052,#101022 65%);min-height:100vh}header{padding:66px 16px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;color:#ffe07a;letter-spacing:3px;font-size:28px;text-shadow:0 0 20px #e7b83b80}.score{text-align:right;font-weight:800;font-size:21px}.score small{display:block;font-size:11px;color:#c5badd}.hamb{position:absolute;top:12px;left:12px;z-index:20;background:#ffdb68;color:#20172f;border:0;border-radius:12px;padding:11px;font-size:18px;font-weight:900}.layout{max-width:1100px;margin:auto;padding:0 12px 80px}.hint{color:#bfb6d5;font-size:12px;text-align:center;margin:0 0 12px}.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.machine{position:relative;background:linear-gradient(155deg,#41336e,#211a3b);border:2px solid #6d5799;border-radius:17px;padding:12px 9px 14px;box-shadow:0 9px 0 #0c0b19,0 12px 25px #0007;min-height:240px}.machine.flash{animation:flash .4s}@keyframes flash{50%{border-color:#fff2a0;box-shadow:0 0 35px #ffdb60}}.machine h3{margin:0 0 8px;color:#e5d5ff;font-size:13px;display:flex;justify-content:space-between}.machine h3 span{color:#f7d96c}.reels{display:flex;gap:4px;margin:7px 21px 12px 0}.reel{background:#fff8ec;color:#252035;border-radius:7px;flex:1;text-align:center;font-size:37px;font-weight:1000;padding:11px 0;box-shadow:inset 0 -5px #ddd2c3}.reel.seven{color:#e43957;text-shadow:0 2px #ffc9c9}.lever{position:absolute;right:4px;top:44px;width:22px;height:105px;touch-action:none;cursor:grab}.rod{position:absolute;width:7px;height:66px;top:16px;left:8px;background:linear-gradient(90deg,#b5a7c9,#fff,#81748e);border-radius:5px}.knob{position:absolute;top:0;left:0;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffabb1,#d9234b 60%,#7a102a);box-shadow:0 2px 7px #0008;transition:transform .12s}.lever.pulled .knob{transform:translateY(65px)}.spin{width:100%;padding:10px;background:#f5cc60;color:#261a2b;border:0;border-radius:9px;font-weight:900;cursor:pointer}.spin:disabled{opacity:.45}.status{height:21px;font-size:12px;color:#d5c8ed;text-align:center;margin-top:9px}.auto{font-size:11px;color:#9ce8ce;text-align:center;margin-top:3px}.overlay{position:fixed;inset:0;background:#050410b9;z-index:29;display:none}.overlay.open{display:block}.shop{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(365px,92vw);overflow-y:auto;background:#201a37;border-right:2px solid #8b6bb8;transform:translateX(-103%);transition:transform .25s;padding:20px 15px 30px}.shop.open{transform:none}.shophead{display:flex;justify-content:space-between;align-items:center}.shophead h2{margin:0;color:#ffe07a}.close{background:#45345f;color:white;border:0;padding:8px 12px;border-radius:8px}.upgrade{background:#322748;border:1px solid #604e7a;border-radius:12px;margin-top:10px;padding:11px}.upgrade strong{display:block;font-size:14px}.upgrade p{font-size:12px;color:#c9bedc;margin:5px 0 9px}.upgrade button{background:#ffe083;border:0;border-radius:8px;padding:8px 10px;font-weight:800;width:100%;color:#2b2033}.upgrade button:disabled{background:#60566e;color:#a89bb7}.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}.pill{border:1px solid #685582;background:#251d40;border-radius:99px;padding:8px 12px;font-size:12px}.pill b{color:#ffde79}.event{margin:0 0 12px;padding:12px;border:1px solid #685385;border-radius:13px;background:#241b3f;display:flex;gap:10px;align-items:center;justify-content:space-between}.event p{font-size:12px;color:#cbbddd;margin:3px 0 0}.event button:disabled{opacity:.45;cursor:not-allowed}.event button,.action{background:#88e6c2;color:#172a28;border:0;border-radius:9px;padding:10px;font-weight:800}.action{display:block;margin:14px auto;background:#9b83e5;color:white}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ffde7d;color:#291d30;border-radius:12px;padding:10px 18px;font-weight:900;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}.toast.show{opacity:1}.footer{text-align:center;color:#817698;font-size:11px;margin-top:30px}.milestones{font-size:12px;color:#cfc4e0;text-align:center;padding:6px}.jackpot{color:#ffe17e;font-weight:900}@media(min-width:750px){header{padding-top:14px;padding-left:145px}.machines{grid-template-columns:repeat(4,1fr)}}
</style></head><body><button class="hamb" id="menu">☰ SHOP</button><header><h1>grow7</h1><div class="score"><small>GROW POINTS</small><span id="points">0</span> ✦</div></header><div class="layout"><p class="hint">レバーを下へスワイプ！ タップでも回せるよ。数字を揃えて7台まで育てよう。</p><div class="bar"><div class="pill">累計 <b id="lifetime">0</b></div><div class="pill">倍率 <b id="mult">×1</b></div><div class="pill">7確率 <b id="sevenRate">—</b></div><div class="pill">連続7 <b id="streak">0</b></div></div><div class="event"><div><b>🎁 ポイントを拾いに行く</b><p id="supplyText">ポイントが少なくなったら無料で補給！</p></div><button id="supply">拾う +100（0回）</button></div><div class="event"><div><b>↩️ 拾ったポイントを返す</b><p>150 ✦ を支払い、拾った回数を1回減らす</p></div><button id="repay">返す −150</button></div><div class="event"><div><b>🌟 フィーバー研究</b><p id="feverText">7が3つ揃うとフィーバーゲージ上昇</p></div><b id="feverGauge">0 / 5</b></div><div id="machines" class="machines"></div><div class="milestones" id="milestone"></div><button class="action" id="reset">ふりだしからやり直す</button><div class="footer">grow7 · ポイントはゲーム内だけで使う架空の通貨です · 自動保存</div></div><div class="overlay" id="overlay"></div><aside class="shop" id="shop"><div class="shophead"><h2>✦ UPGRADE</h2><button class="close" id="close">閉じる ✕</button></div><p style="font-size:12px;color:#c6b9dc">強化して、7だらけの研究所を作ろう！</p><div id="upgrades"></div></aside><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='grow7-save-v1';const base={points:100,lifetime:0,slots:1,auto:[0,0,0,0,0,0,0],luck:0,rate:0,discount:0,fever:0,feverUntil:0,streak:0,spins:0,bonus:0,supplyCount:0};let s={...base};try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')s={...base,...x,auto:Array.isArray(x.auto)?x.auto.slice(0,7):base.auto}}catch(e){};const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ja-JP'),save=()=>localStorage.setItem(KEY,JSON.stringify(s));let resetting=false;let busy=Array(7).fill(false),last=Array(7).fill(0),timers=Array(7).fill(0),lastRender=0;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),1900)}function cost(kind,level){let v={slot:220,auto:110,luck:140,rate:170,discount:400}[kind];return Math.max(1,Math.ceil(v*Math.pow(kind==='slot'?2.15:kind==='auto'?1.8:1.7,level)*(1-s.discount*.045)))}function weights(){return [1,2,3,4,5,6,7,7,7].concat(Array(s.luck).fill(7))}function symbol(){let w=weights();return w[Math.floor(Math.random()*w.length)]}function payout(a){let sevens=a.filter(x=>x===7).length;if(sevens===3)return 75;if(a[0]===a[1]&&a[1]===a[2])return 20;if(sevens===2)return 8;if(a[0]===a[1]||a[1]===a[2]||a[0]===a[2])return 3;return 0}function spin(i){if(i>=s.slots||busy[i]||s.points<10)return;busy[i]=true;s.points-=10;s.spins++;let m=$('m'+i),reels=m.querySelectorAll('.reel'),button=m.querySelector('.spin');button.disabled=true;m.querySelector('.status').textContent='回転中…';let count=0;let interval=setInterval(()=>{reels.forEach(r=>{let v=symbol();r.textContent=v;r.classList.toggle('seven',v===7)});if(resetting){clearInterval(interval);return}if(++count>=8){clearInterval(interval);let a=[symbol(),symbol(),symbol()],p=payout(a),fever=Date.now()<s.feverUntil,earn=p*(1+s.rate)*(fever?3:1);reels.forEach((r,j)=>{r.textContent=a[j];r.classList.toggle('seven',a[j]===7)});s.points+=earn;s.lifetime+=earn;let st=m.querySelector('.status');if(p===75){s.streak++;s.fever++;st.textContent='🌟 777！ +'+fmt(earn);m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash');if(s.fever>=5){s.fever=0;s.feverUntil=Date.now()+20000;toast('🔥 フィーバー！20秒間獲得ポイント3倍！')}}else{if(p)st.textContent='当たり！ +'+fmt(earn);else st.textContent='次こそ7を！';s.streak=0}if(s.spins%50===0){s.points+=200;toast('🏅 50回転ボーナス +200！')}busy[i]=false;button.disabled=false;save();renderTop();}},45)}function makeMachine(i){let div=document.createElement('div');div.className='machine';div.id='m'+i;div.innerHTML=`<h3>GROW UNIT <span>#${i+1}</span></h3><div class="reels"><div class="reel seven">7</div><div class="reel">3</div><div class="reel">1</div></div><div class="lever"><div class="rod"></div><div class="knob"></div></div><button class="spin">回す · 10 ✦</button><div class="status">レバーを引こう！</div><div class="auto"></div>`;div.querySelector('.spin').onclick=()=>spin(i);let lever=div.querySelector('.lever'),start=null;lever.addEventListener('pointerdown',e=>{start=e.clientY;lever.setPointerCapture(e.pointerId);lever.classList.add('pulled')});lever.addEventListener('pointerup',e=>{if(start!==null){lever.classList.remove('pulled');spin(i);start=null}});lever.addEventListener('pointercancel',()=>{lever.classList.remove('pulled');start=null});return div}function renderMachines(){let root=$('machines');root.innerHTML='';for(let i=0;i<s.slots;i++)root.appendChild(makeMachine(i));renderAuto()}function renderAuto(){for(let i=0;i<s.slots;i++){let m=$('m'+i);if(m)m.querySelector('.auto').textContent=s.auto[i]?'⚡ AUTO Lv.'+s.auto[i]+' · '+(Math.max(0.4,3.5*Math.pow(.77,s.auto[i]-1))).toFixed(1)+'秒':'手動モード'}}function renderTop(){$('points').textContent=fmt(s.points);$('lifetime').textContent=fmt(s.lifetime);$('mult').textContent='×'+(s.rate+1);$('sevenRate').textContent=(100*(3+s.luck)/(9+s.luck)).toFixed(1)+'%';$('streak').textContent=s.streak;$('feverGauge').textContent=Date.now()<s.feverUntil?'🔥 '+Math.ceil((s.feverUntil-Date.now())/1000)+'秒':s.fever+' / 5';$('supply').disabled=s.points>=100;$('supply').textContent='拾う +100（'+s.supplyCount+'回）';$('repay').disabled=s.supplyCount<=0||s.points<150;$('milestone').textContent=`研究所の進捗：${s.slots}/7台解放 · 合計${fmt(s.spins)}回転 · 次の目標は全台自動化！`;}function row(name,desc,price,fn,disabled){let d=document.createElement('div');d.className='upgrade';d.innerHTML='<strong></strong><p></p><button></button>';d.querySelector('strong').textContent=name;d.querySelector('p').textContent=desc;let b=d.querySelector('button');b.textContent=price===null?'MAX':fmt(price)+' ✦ で強化';b.disabled=disabled||price===null||s.points<price;b.onclick=()=>{if(s.points<price)return;s.points-=price;fn();save();renderShop();renderTop();renderAuto()};return d}function renderShop(){let r=$('upgrades');r.innerHTML='';r.appendChild(row('🏗️ スロット増加 · '+s.slots+'/7','新しいユニットを1台増設！',s.slots>=7?null:cost('slot',s.slots-1),()=>{s.slots++;renderMachines();toast('新しいユニット解放！')},s.slots>=7));for(let i=0;i<s.slots;i++){let n=s.auto[i];r.appendChild(row('⚡ '+(i+1)+'スロットの自動化 · Lv.'+n,'自動回転。強化するほど間隔が短縮',n>=12?null:cost('auto',n+i),()=>{s.auto[i]++;toast('自動化レベルアップ！')},n>=12))}r.appendChild(row('🔴 7の増加 · Lv.'+s.luck,'リール内の7の比率が増える（最大20）',s.luck>=20?null:cost('luck',s.luck),()=>{s.luck++},s.luck>=20));r.appendChild(row('💎 当たりレートの増加 · Lv.'+s.rate,'当たり時の獲得ポイントが+1倍',s.rate>=30?null:cost('rate',s.rate),()=>{s.rate++},s.rate>=30));r.appendChild(row('🧪 研究効率 · Lv.'+s.discount,'アップグレード費用を少し割引（最大10）',s.discount>=10?null:cost('discount',s.discount),()=>{s.discount++},s.discount>=10))}function toggle(open){$('shop').classList.toggle('open',open);$('overlay').classList.toggle('open',open);if(open)renderShop()}$('menu').onclick=()=>toggle(true);$('close').onclick=()=>toggle(false);$('overlay').onclick=()=>toggle(false);$('supply').onclick=()=>{if(s.points>=100)return;s.points+=100;s.supplyCount++;toast('🎁 ポイントを拾った！ +100！');save();renderTop()};$('repay').onclick=()=>{if(s.supplyCount<=0||s.points<150)return;s.points-=150;s.supplyCount--;save();renderTop();toast('↩️ 150ポイント返却！ 拾った回数 −1')};$('reset').onclick=()=>{if(!confirm('ふりだしからやり直しますか？ スロット・アップグレード・ポイントなど、すべての進行状況が初期化されます。'))return;
// 初期状態を保存してから再読み込み。削除だけだと回転中の処理が古いデータを再保存する可能性がある。
resetting=true;s=JSON.parse(JSON.stringify(base));save();location.reload()};renderMachines();renderTop();setInterval(()=>{let now=Date.now();for(let i=0;i<s.slots;i++){if(!s.auto[i])continue;let delay=Math.max(400,3500*Math.pow(.77,s.auto[i]-1));if(now-last[i]>=delay&&!busy[i]&&s.points>=10){last[i]=now;spin(i)}}if(now-lastRender>500){renderTop();if($('shop').classList.contains('open'))renderShop();lastRender=now}},180);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});})();
</script></body></html>
